<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loan application demo</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900">
    <main class="mx-auto max-w-md px-4 py-12">
      <p class="mb-4 rounded border border-slate-200 bg-white p-3 text-sm">ShieldLabs tutorial: simulated actions only. Do not enter real passwords, payment details or personal information.</p>
      <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">Demo Lending</p>
      <h1 class="mt-1 text-2xl font-semibold">Check your personal loan offer</h1>
      <p class="mt-2 text-sm text-slate-600">An instant decision, based on what you tell us.</p>

      <form id="loanForm" class="mt-6 space-y-4 rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
        <div class="grid grid-cols-2 gap-3">
          <label class="block">
            <span class="text-sm font-medium">First name</span>
            <input id="firstName" name="firstName" autocomplete="given-name" required class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2" value="Demo" />
          </label>
          <label class="block">
            <span class="text-sm font-medium">Last name</span>
            <input id="lastName" name="lastName" autocomplete="family-name" required class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2" value="Applicant" />
          </label>
        </div>
        <label class="block">
          <span class="text-sm font-medium">Monthly income (USD, after tax)</span>
          <input id="monthlyIncome" name="monthlyIncome" type="number" min="1" step="1" required class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2" value="5000" />
        </label>
        <div class="grid grid-cols-2 gap-3">
          <label class="block">
            <span class="text-sm font-medium">Loan amount (USD)</span>
            <input id="amount" name="amount" type="number" min="500" max="50000" step="100" required class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2" value="1000" />
          </label>
          <label class="block">
            <span class="text-sm font-medium">Term</span>
            <select id="termMonths" name="termMonths" class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2">
              <option value="6">6 months</option>
              <option value="12" selected>12 months</option>
              <option value="24">24 months</option>
              <option value="36">36 months</option>
            </select>
          </label>
        </div>
        <button
          id="applyBtn"
          type="submit"
          class="w-full rounded-md bg-slate-900 px-4 py-2 font-medium text-white hover:bg-slate-700 disabled:opacity-60"
        >
          Check my offer
        </button>
      </form>

      <div id="result" class="hidden" role="status"></div>

      <footer class="mt-10 text-center text-xs text-slate-500">
        <a id="resetDb" href="#" class="underline">Reset demo DB</a>
      </footer>
    </main>

    <script src="/config.js"></script>
    <script src="/vendor/shieldlabs.js"></script>
    <script type="module" src="/index.js"></script>
  </body>
</html>
