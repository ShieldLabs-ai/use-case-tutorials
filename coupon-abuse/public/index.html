<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Coupon abuse demo</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900">
    <main class="mx-auto max-w-md px-4 py-12">
      <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">Demo Outdoor Shop</p>
      <h1 class="mt-1 text-2xl font-semibold">Your cart</h1>

      <div class="mt-6 rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
        <ul id="items" class="divide-y divide-slate-100 text-sm"></ul>

        <form id="couponForm" class="mt-6 flex gap-2">
          <input
            id="code"
            name="code"
            placeholder="Coupon code"
            autocomplete="off"
            required
            class="flex-1 rounded-md border border-slate-300 px-3 py-2 uppercase"
          />
          <button
            id="applyBtn"
            type="submit"
            class="rounded-md bg-slate-900 px-4 py-2 font-medium text-white hover:bg-slate-700 disabled:opacity-60"
          >
            Apply
          </button>
        </form>
        <p class="mt-2 text-xs text-slate-500">
          Sample codes: <code>WELCOME20</code> (20% off your first order) and <code>SPRING10</code> (10% off).
        </p>

        <div class="mt-6 space-y-1 border-t border-slate-100 pt-4 text-sm">
          <p class="flex justify-between"><span>Subtotal</span><span id="subtotal"></span></p>
          <div id="discountRow" class="hidden">
            <p class="flex justify-between text-emerald-700">
              <span>Discount (<span id="discountCode"></span>)</span><span id="discount"></span>
            </p>
          </div>
          <p class="flex justify-between text-base font-semibold"><span>Total</span><span id="total"></span></p>
        </div>
      </div>

      <div id="result" class="hidden" role="status"></div>

      <footer class="mt-10 text-center text-xs text-slate-500">
        <a id="resetDb" href="#" class="underline">Reset demo DB</a>
      </footer>
    </main>

    <script src="/config.js"></script>
    <script type="module" src="/index.js"></script>
  </body>
</html>
