<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New account fraud demo</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900">
    <main class="mx-auto max-w-md px-4 py-12">
      <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">Demo Notes</p>
      <h1 class="mt-1 text-2xl font-semibold">Start your 14-day free trial</h1>
      <p class="mt-2 text-sm text-slate-600">No credit card needed. One free trial per person.</p>

      <form id="signupForm" class="mt-6 space-y-4 rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
        <label class="block">
          <span class="text-sm font-medium">Username</span>
          <input
            id="username"
            name="username"
            autocomplete="username"
            required
            class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2"
          />
        </label>
        <label class="block">
          <span class="text-sm font-medium">Password</span>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="new-password"
            required
            class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2"
          />
        </label>
        <button
          id="signupBtn"
          type="submit"
          class="w-full rounded-md bg-slate-900 px-4 py-2 font-medium text-white hover:bg-slate-700 disabled:opacity-60"
        >
          Start free trial
        </button>
      </form>

      <div id="result" class="hidden" role="status"></div>

      <footer class="mt-10 text-center text-xs text-slate-500">
        <a id="resetDb" href="#" class="underline">Reset demo DB</a>
      </footer>
    </main>

    <script type="module" src="/index.js"></script>
  </body>
</html>
