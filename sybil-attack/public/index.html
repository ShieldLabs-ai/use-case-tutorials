<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sybil attack demo</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900">
    <main class="mx-auto max-w-md px-4 py-12">
      <p class="mb-4 rounded border border-slate-200 bg-white p-3 text-sm">ShieldLabs tutorial: simulated actions only. Do not enter real passwords, payment details or personal information.</p>
      <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">Acme Chain Airdrop</p>
      <h1 class="mt-1 text-2xl font-semibold">Claim your ACME tokens</h1>
      <p class="mt-2 text-sm text-slate-600">
        100 ACME tokens, once per wallet. This airdrop and the ACME token are simulated: nothing is ever sent.
      </p>

      <form id="claimForm" class="mt-6 space-y-4 rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
        <label class="block">
          <span class="text-sm font-medium">Wallet address</span>
          <input
            id="walletAddress"
            name="walletAddress"
            placeholder="0x..."
            autocomplete="off"
            required
            class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 font-mono text-sm" value="0xabcdef12" />
        </label>
        <button
          id="claimBtn"
          type="submit"
          class="w-full rounded-md bg-slate-900 px-4 py-2 font-medium text-white hover:bg-slate-700 disabled:opacity-60"
        >
          Claim 100 ACME
        </button>
      </form>

      <div id="result" class="hidden" role="status"></div>

      <p id="claimCount" class="mt-6 text-center text-xs text-slate-500"></p>

      <footer class="mt-10 text-center text-xs text-slate-500">
        <a id="resetDb" href="#" class="underline">Reset demo DB</a>
      </footer>
    </main>

    <script src="/config.js"></script>
    <script src="/vendor/shieldlabs.js"></script>
    <script type="module" src="/index.js"></script>
  </body>
</html>
