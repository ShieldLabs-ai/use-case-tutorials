<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Returning visitor demo</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900">
    <main class="mx-auto max-w-5xl px-4 py-12">
      <p class="mb-4 rounded border border-slate-200 bg-white p-3 text-sm">ShieldLabs tutorial: simulated actions only. Do not enter real passwords, payment details or personal information.</p>
      <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">Demo Home Goods</p>
      <h1 class="mt-1 text-2xl font-semibold">Find something for your home</h1>

      <form id="searchForm" class="mt-6 flex gap-2">
        <input
          id="query"
          name="query"
          type="search"
          placeholder="Search lamps, mugs, plants..."
          class="flex-1 rounded-md border border-slate-300 bg-white px-3 py-2"
        />
        <button id="searchBtn" type="submit" class="rounded-md bg-slate-900 px-4 py-2 font-medium text-white hover:bg-slate-700">
          Search
        </button>
      </form>

      <div id="result" class="hidden" role="status"></div>

      <div class="mt-6 grid gap-6 md:grid-cols-4">
        <section class="md:col-span-3">
          <p id="resultsLabel" class="text-sm text-slate-500"></p>
          <ul id="results" class="mt-3 grid gap-3 sm:grid-cols-2 lg:grid-cols-3"></ul>
        </section>

        <aside class="space-y-6">
          <div class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
            <h2 class="text-sm font-semibold">Recent searches</h2>
            <ul id="recentSearches" class="mt-2 flex flex-wrap gap-2 text-sm"></ul>
          </div>
          <div class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
            <h2 class="text-sm font-semibold">Saved items</h2>
            <ul id="saved" class="mt-2 space-y-1 text-sm"></ul>
          </div>
        </aside>
      </div>

      <footer class="mt-10 text-center text-xs text-slate-500">
        <a id="resetDb" href="#" class="underline">Reset demo DB</a>
      </footer>
    </main>

    <script type="module" src="/index.js"></script>
  </body>
</html>
