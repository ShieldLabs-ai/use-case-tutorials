<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Account sharing demo</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900">
    <main class="mx-auto max-w-md px-4 py-12">
      <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">Demo Stream</p>

      <section id="signedOutView">
        <h1 class="mt-1 text-2xl font-semibold">Sign in to watch</h1>
        <p class="mt-2 text-sm text-slate-600">Your plan streams on one device at a time.</p>

        <form id="loginForm" class="mt-6 space-y-4 rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
          <label class="block">
            <span class="text-sm font-medium">Email</span>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="username"
              required
              class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2"
            />
          </label>
          <label class="block">
            <span class="text-sm font-medium">Password</span>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
              class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2"
            />
          </label>
          <button
            id="loginBtn"
            type="submit"
            class="w-full rounded-md bg-slate-900 px-4 py-2 font-medium text-white hover:bg-slate-700 disabled:opacity-60"
          >
            Sign in
          </button>
          <button
            id="takeOverBtn"
            type="button"
            class="hidden w-full rounded-md border border-red-300 px-4 py-2 text-sm font-medium text-red-700 hover:bg-red-50"
          >
            Sign out the other device and sign in here
          </button>
          <p class="text-xs text-slate-500">
            Demo account: <code>demo@example.com</code> / <code>demo-password</code>
          </p>
        </form>
      </section>

      <section id="signedInView" class="hidden">
        <h1 class="mt-1 text-2xl font-semibold">Now playing</h1>
        <div class="mt-6 rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
          <div class="flex aspect-video items-center justify-center rounded-lg bg-slate-900 text-slate-300">
            <svg viewBox="0 0 24 24" class="h-12 w-12" fill="currentColor" aria-hidden="true">
              <path d="M8 5v14l11-7z" />
            </svg>
          </div>
          <p class="mt-4 font-medium">The Lighthouse Keeper</p>
          <p class="text-sm text-slate-600">Season 1, Episode 3</p>
          <div class="mt-3 h-1.5 rounded-full bg-slate-200">
            <div class="h-1.5 w-1/3 rounded-full bg-slate-900"></div>
          </div>
          <div class="mt-6 flex items-center justify-between text-sm">
            <span class="text-slate-600">Signed in as <span id="accountEmail" class="font-medium"></span></span>
            <button id="logoutBtn" type="button" class="rounded-md border border-slate-300 px-3 py-1.5 hover:bg-slate-100">
              Sign out
            </button>
          </div>
        </div>
      </section>

      <div id="result" class="hidden" role="status"></div>

      <footer class="mt-10 text-center text-xs text-slate-500">
        <a id="resetDb" href="#" class="underline">Reset demo DB</a>
      </footer>
    </main>

    <script src="/config.js"></script>
    <script type="module" src="/index.js"></script>
  </body>
</html>
