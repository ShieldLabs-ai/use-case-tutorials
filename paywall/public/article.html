<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paywall demo: article</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900">
    <main class="mx-auto max-w-2xl px-4 py-12">
      <div class="flex items-baseline justify-between">
        <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">The Millbrook Ledger</p>
        <a href="/" class="text-sm underline">All articles</a>
      </div>

      <p id="loading" class="mt-6 text-sm text-slate-500">Loading the article...</p>
      <div id="result" class="hidden" role="status"></div>

      <article id="article" class="mt-6 hidden rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
        <h1 id="title" class="text-2xl font-semibold"></h1>
        <p id="byline" class="mt-1 text-sm text-slate-500"></p>
        <div id="body" class="mt-4 space-y-4 leading-relaxed"></div>
      </article>
    </main>

    <script src="/config.js"></script>
    <script type="module" src="/article.js"></script>
  </body>
</html>
