<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Credential stuffing demo</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900">
    <main class="mx-auto max-w-md px-4 py-12">
      <p class="mb-4 rounded border border-slate-200 bg-white p-3 text-sm">ShieldLabs tutorial: simulated actions only. Do not enter real passwords, payment details or personal information.</p>
      <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">Demo Account</p>
      <h1 class="mt-1 text-2xl font-semibold">Sign in</h1>

      <form id="loginForm" class="mt-6 space-y-4 rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
        <label class="block">
          <span class="text-sm font-medium">Email</span>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="username"
            required
            class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2"
          />
        </label>
        <label class="block">
          <span class="text-sm font-medium">Password</span>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
            class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2"
          />
        </label>
        <button
          id="loginBtn"
          type="submit"
          class="w-full rounded-md bg-slate-900 px-4 py-2 font-medium text-white hover:bg-slate-700 disabled:opacity-60"
        >
          Sign in
        </button>
        <p class="text-xs text-slate-500">
          Demo account: <code>demo@example.com</code> / <code>demo-password</code>
        </p>
      </form>

      <form id="codeForm" class="mt-4 hidden space-y-3 rounded-xl border border-amber-300 bg-amber-50 p-6">
        <p class="text-sm font-medium">Confirm it is you</p>
        <p class="rounded-md bg-slate-900 p-3 text-sm text-slate-100">
          Demo email: your sign-in code is <span id="demoCode" class="font-mono font-semibold"></span>
        </p>
        <input
          id="code"
          name="code"
          inputmode="numeric"
          autocomplete="one-time-code"
          placeholder="6-digit code"
          required
          class="w-full rounded-md border border-slate-300 bg-white px-3 py-2"
        />
        <button type="submit" class="w-full rounded-md bg-slate-900 px-4 py-2 font-medium text-white hover:bg-slate-700">
          Verify and sign in
        </button>
      </form>

      <div id="result" class="hidden" role="status"></div>

      <footer class="mt-10 text-center text-xs text-slate-500">
        <a id="resetDb" href="#" class="underline">Reset demo DB</a>
      </footer>
    </main>

    <script src="/config.js"></script>
    <script src="/vendor/shieldlabs.js"></script>
    <script type="module" src="/index.js"></script>
  </body>
</html>
