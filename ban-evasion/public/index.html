<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ban evasion demo</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900">
    <main class="mx-auto max-w-4xl px-4 py-12">
      <p class="mb-4 rounded border border-slate-200 bg-white p-3 text-sm">ShieldLabs tutorial: simulated actions only. Do not enter real passwords, payment details or personal information.</p>
      <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">Demo Forum</p>
      <h1 class="mt-1 text-2xl font-semibold">Neighborhood board</h1>

      <div class="mt-6 grid gap-6 md:grid-cols-3">
        <section class="space-y-4 md:col-span-2">
          <form id="postForm" class="hidden rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
            <textarea
              id="postBody"
              name="body"
              rows="3"
              placeholder="Write a post"
              class="w-full rounded-md border border-slate-300 px-3 py-2"
            ></textarea>
            <div class="mt-2 text-right">
              <button type="submit" class="rounded-md bg-slate-900 px-4 py-2 text-sm font-medium text-white hover:bg-slate-700">
                Post
              </button>
            </div>
          </form>
          <ul id="posts" class="space-y-3"></ul>
        </section>

        <aside class="space-y-6">
          <div class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
            <h2 class="font-semibold">Your account</h2>
            <form id="accountForm" class="mt-3 space-y-3">
              <input
                id="username"
                name="username"
                placeholder="Username"
                autocomplete="username"
                required
                class="w-full rounded-md border border-slate-300 px-3 py-2"
              />
              <input
                id="password"
                name="password"
                type="password"
                placeholder="Password"
                autocomplete="current-password"
                required
                class="w-full rounded-md border border-slate-300 px-3 py-2"
              />
              <div class="flex gap-2">
                <button
                  id="signupBtn"
                  type="submit"
                  value="signup"
                  class="flex-1 rounded-md bg-slate-900 px-3 py-2 text-sm font-medium text-white hover:bg-slate-700 disabled:opacity-60"
                >
                  Sign up
                </button>
                <button
                  id="signinBtn"
                  type="submit"
                  value="signin"
                  class="flex-1 rounded-md border border-slate-300 px-3 py-2 text-sm font-medium hover:bg-slate-100 disabled:opacity-60"
                >
                  Sign in
                </button>
              </div>
            </form>
            <div id="signedIn" class="mt-3 hidden text-sm">
              <p>Signed in as <span id="currentUser" class="font-medium"></span></p>
              <button id="signoutBtn" type="button" class="mt-2 rounded-md border border-slate-300 px-3 py-1.5 hover:bg-slate-100">
                Sign out
              </button>
            </div>
          </div>

          <div class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
            <h2 class="font-semibold">Moderator tools</h2>
            <p class="mt-1 text-xs text-slate-500">Demo only: anyone can ban a member here.</p>
            <ul id="members" class="mt-3 divide-y divide-slate-100 text-sm"></ul>
          </div>

          <div id="result" class="hidden" role="status"></div>
        </aside>
      </div>

      <footer class="mt-10 text-center text-xs text-slate-500">
        <a id="resetDb" href="#" class="underline">Reset demo DB</a>
      </footer>
    </main>

    <script src="/config.js"></script>
    <script src="/vendor/shieldlabs.js"></script>
    <script type="module" src="/index.js"></script>
  </body>
</html>
