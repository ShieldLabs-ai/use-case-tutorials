<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bonus abuse demo</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900">
    <main class="mx-auto max-w-md px-4 py-12">
      <p class="mb-4 rounded border border-slate-200 bg-white p-3 text-sm">ShieldLabs tutorial: simulated actions only. Do not enter real passwords, payment details or personal information.</p>
      <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">Acme Wallet</p>

      <section id="signedOutView">
        <h1 class="mt-1 text-2xl font-semibold">Create your account</h1>
        <p class="mt-2 text-sm text-slate-600">Get a 100% match on your first deposit, up to $100.</p>

        <form id="signupForm" class="mt-6 space-y-4 rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
          <label class="block">
            <span class="text-sm font-medium">Email</span>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="username"
              required
              class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2"
            />
          </label>
          <label class="block">
            <span class="text-sm font-medium">Password</span>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              required
              class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2"
            />
          </label>
          <button
            id="signupBtn"
            type="submit"
            class="w-full rounded-md bg-slate-900 px-4 py-2 font-medium text-white hover:bg-slate-700 disabled:opacity-60"
          >
            Create account
          </button>
        </form>
      </section>

      <section id="signedInView" class="hidden">
        <h1 class="mt-1 text-2xl font-semibold">Your wallet</h1>
        <div class="mt-6 rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
          <p class="text-sm text-slate-600">Available balance</p>
          <p id="balance" class="mt-1 text-3xl font-semibold"></p>
          <div class="mt-6 flex items-center justify-between text-sm">
            <span class="text-slate-600">Signed in as <span id="accountEmail" class="font-medium"></span></span>
            <button id="logoutBtn" type="button" class="rounded-md border border-slate-300 px-3 py-1.5 hover:bg-slate-100">
              Sign out
            </button>
          </div>
        </div>

        <form id="depositForm" class="mt-4 space-y-4 rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
          <h2 class="text-sm font-semibold">Make a deposit</h2>
          <label class="block">
            <span class="text-sm font-medium">Amount (USD)</span>
            <input
              id="amount"
              name="amount"
              type="number"
              min="1"
              step="0.01"
              placeholder="50.00"
              required
              class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2"
            />
          </label>
          <button
            id="depositBtn"
            type="submit"
            class="w-full rounded-md bg-slate-900 px-4 py-2 font-medium text-white hover:bg-slate-700 disabled:opacity-60"
          >
            Deposit
          </button>
        </form>
      </section>

      <div id="result" class="hidden" role="status"></div>

      <footer class="mt-10 text-center text-xs text-slate-500">
        <a id="resetDb" href="#" class="underline">Reset demo DB</a>
      </footer>
    </main>

    <script type="module" src="/index.js"></script>
  </body>
</html>
